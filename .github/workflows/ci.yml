name: ci

on:
  push:
    branches:
      - main
      - 'codex/**'
      - 'fix/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: build + unit + pester
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Show toolchain
        shell: pwsh
        run: |
          dotnet --version
          $PSVersionTable.PSVersion.ToString()

      - name: Build solution
        run: dotnet build QuietMode.sln -c Release -v minimal --nologo

      - name: C# unit tests
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'tests\QuietMode.Core.Tests\bin\Release\net481\QuietMode.Core.Tests.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "未找到测试可执行文件：$exe" }
          & $exe
          if ($LASTEXITCODE -ne 0) { throw "单测失败，退出码 $LASTEXITCODE" }

      - name: Verify qmctl artifact
        shell: pwsh
        run: |
          $tool = Join-Path $PWD 'src\QuietMode.Cli\bin\Release\net481\qmctl.exe'
          if (-not (Test-Path -LiteralPath $tool)) { throw "构建产物缺失：$tool" }
          & $tool --help
          if ($LASTEXITCODE -ne 0) { throw "qmctl --help 退出码 $LASTEXITCODE" }

      - name: Install Pester
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Module -ListAvailable Pester | Select-Object Name, Version | Format-Table -AutoSize
          if (-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version -ge [version]'5.7.0' })) {
            Set-PSRepository PSGallery -InstallationPolicy Trusted
            Install-Module Pester -MinimumVersion 5.7.0 -Force -SkipPublisherCheck -Scope CurrentUser
          }

      - name: Pester
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Pester -MinimumVersion 5.7.0 -Force

          $cfg = New-PesterConfiguration
          $cfg.Run.Path = 'tests\ps'
          $cfg.Run.PassThru = $true
          $cfg.Output.Verbosity = 'Normal'
          $cfg.TestResult.Enabled = $true
          $cfg.TestResult.OutputPath = 'testResults.xml'
          $cfg.TestResult.OutputFormat = 'NUnitXml'

          $result = Invoke-Pester -Configuration $cfg
          Write-Host ("Total={0} Passed={1} Failed={2} Skipped={3}" -f `
            $result.TotalCount, $result.PassedCount, $result.FailedCount, $result.SkippedCount)

          if ($result.TotalCount -eq 0) { throw 'Pester 没有执行任何测试' }
          if ($result.FailedCount -gt 0) { throw "Pester 失败 $($result.FailedCount) 项" }

      - name: Upload Pester result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-result
          path: testResults.xml
          if-no-files-found: ignore
